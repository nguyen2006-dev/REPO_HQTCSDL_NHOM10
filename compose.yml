services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports: ["127.0.0.1:1433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  web:
    build: ./src/FilmContest.Web
    profiles: ["app"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SqlServer: ${APP_SQL_CONNECTION:-}
      Jwt__Key: ${JWT_KEY:-}
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}
    ports: ["127.0.0.1:5080:8080"]
    volumes: ["assets:/app/App_Data"]
    depends_on:
      sql:
        condition: service_healthy
volumes:
  sql-data:
  assets:
